name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project NineGridPuzzle.xcodeproj \
            -scheme NineGridPuzzle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $APP_PATH"
          rm -rf Payload NineGridPuzzle.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NineGridPuzzle.ipa Payload
          ls -lh NineGridPuzzle.ipa

      - name: Publish IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 九格拼图 v1.0.${{ github.run_number }}
          body: 自动构建的未签名 IPA，可直接用 TrollStore 安装。
          files: NineGridPuzzle.ipa
